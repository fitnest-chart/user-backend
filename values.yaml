vaultEnv: development
# values.yaml for user-backend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/user-backend
  tag: "development-d48f76c"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
networkPolicy:
  enabled: true
  allowedServices:
    - identity-backend
    - payment-backend
    - storage-backend
    - catalog-backend
    # gateway-backend is already hardcoded in the policy template
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
jwt:
  secret: "your-jwt-secret-change-in-production"
env:
  SPRING_PROFILES_ACTIVE: dev
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.0.4:5432/fitnest_user?sslmode=disable
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_AZ_FITNEST_USER: DEBUG
  LOGGING_LEVEL_AZ_FITNEST_ORDER: DEBUG
  LOGGING_LEVEL_AZ_FITNEST: DEBUG
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
  LOGGING_LEVEL_FEIGN_LOGGER: OFF
  SPRING_DATA_REDIS_HOST: "10.0.0.4"
  SPRING_DATA_REDIS_PORT: "6380"
  SPRING_DATA_REDIS_TIMEOUT: "2000ms"
  KAFKA_BOOTSTRAP_SERVERS: "10.0.0.4:9092"
  JWT_ISSUER: "fitnest"
  IDENTITY_BACKEND_URL: "http://identity-backend:8080"
  ORDER_BACKEND_GRPC_ADDRESS: "dns:///order-backend.fitnest-development.svc.cluster.local:9090"
  NOTIFICATIONS_BACKEND_URL: "http://notifications-backend:8080"
  NOTIFICATIONS_BACKEND_GRPC_HOST: "notifications-backend"
  NOTIFICATIONS_BACKEND_GRPC_PORT: "9090"
  GRPC_USE_TLS: "false"
  GRPC_TLS_CLIENT_CERT: "/etc/certs/tls.crt"
  GRPC_TLS_CLIENT_KEY: "/etc/certs/tls.key"
  GRPC_TLS_CA_CERT: "/etc/certs/ca.crt"
  GRPC_SERVER_TLS_ENABLED: "false"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

resources:
  requests:
    cpu: 59m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi
