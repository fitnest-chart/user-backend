hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 450Mi
  minReplicas: '1'
image:
  imagePullSecrets:
    - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/user-backend
  tag: production-be560f2
jwt:
  secret: your-jwt-secret-change-in-production
networkPolicy:
  allowedServices:
    - identity-backend
    - payment-backend
    - storage-backend
    - catalog-backend
  enabled: true
replicaCount: 1
resources:
  requests:
    cpu: 200m
    memory: 1024Mi
  limits:
    cpu: 1500m
    memory: 1536Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: production
database:
  hikariMaxPool: 30
  hikariMinIdle: 10
