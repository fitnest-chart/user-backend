hpa:
  cpuUtilization: '90'
  enabled: false
  maxReplicas: '3'
  memoryUtilization: 450Mi
  minReplicas: '1'
image:
  imagePullSecrets:
  - name: ghcr-secret
  pullPolicy: IfNotPresent
  repository: ghcr.io/fitnest-code/user-backend
  tag: development-361d58a
jwt:
  secret: your-jwt-secret-change-in-production
networkPolicy:
  allowedServices:
  - identity-backend
  - payment-backend
  - storage-backend
  - catalog-backend
  enabled: true
replicaCount: 1
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 59m
    memory: 512Mi
service:
  grpcPort: 9090
  port: 8080
  type: ClusterIP
vaultEnv: production
